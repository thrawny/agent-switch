[package]
name = "agent-switch"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
notify = "8"
time = { version = "0.3", features = ["parsing", "formatting"] }
toml = "0.9"
gtk4 = { version = "0.10", features = ["v4_6"] }
gtk4-layer-shell = "0.7"
niri-ipc = "=26.4.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
